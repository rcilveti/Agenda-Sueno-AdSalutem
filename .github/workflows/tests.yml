# Pruebas automáticas de la Agenda de Sueño en cada cambio (GitHub Actions)
name: Pruebas
on:
  push:
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5      # checkout y setup-node v5 funcionan con Node 24 (Node 20 está en desuso en GitHub Actions)
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
